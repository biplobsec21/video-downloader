<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbed Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="libs/uuid.min.js"></script>
    <script src="libs/axios.min.js"></script>
    <script src="fbVideoInfo.js"></script>
    <style>
        .spinner-border {
            border-top-color: transparent;
        }
    </style>
</head>

<body class="bg-gray-100 p-4" style="width: 500px;">
    <div>
        <ul class="flex border-b">
            <li class="-mb-px mr-1">
                <a href="#facebook"
                    class="tab-link bg-white inline-block py-2 px-4 text-blue-500 font-semibold border-b-2 border-blue-500"
                    data-target="facebookContent">Facebook Pages</a>
            </li>
            <li class="mr-1">
                <a href="#instagram"
                    class="tab-link bg-white inline-block py-2 px-4 text-gray-600 hover:text-blue-500 font-semibold"
                    data-target="instagramContent">Instagram Pages</a>
            </li>
            <li class="mr-1">
                <a href="#tiktok"
                    class="tab-link bg-white inline-block py-2 px-4 text-gray-600 hover:text-blue-500 font-semibold"
                    data-target="tiktokContent">Tiktok Pages</a>
            </li>
            <li class="mr-1">
                <a href="#youtube"
                    class="tab-link bg-white inline-block py-2 px-4 text-gray-600 hover:text-blue-500 font-semibold"
                    data-target="youtubeContent">Youtube</a>
            </li>
        </ul>

        <div id="facebookContent" class="tab-content mt-4 flex flex-row flex-wrap space-y-8 relative">
            <!-- Content for Facebook Pages -->
            <div class="flex items-center space-x-4">
                <!-- Circular Image -->
                <img id="fbPageImage" src="" alt="FB Page" class="w-24 h-24 rounded-full object-cover shadow" />

                <div>
                    <!-- Page Name -->
                    <a id="fbPageUrl" href="#" class="text-blue-500 underline cursor-pointer">
                        <h2 id="fbPageName" class="text-lg font-semibold text-gray-800"></h2>
                    </a>
                    <!-- Likes + Followers -->
                    <p class="text-sm text-gray-500">
                        <span id="fbPageLikes" class="mr-4"></span>
                        <span id="fbPageFollowers"></span>
                    </p>
                </div>
            </div>

            <div class="space-y-3 w-full">
                <button id="collectReelsBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow">
                    📥 Collect Reels
                </button>

                <div id="reelsSummary" class="hidden bg-white rounded p-3 border text-gray-700 text-sm">
                    <!-- Summary will be injected here -->
                </div>

                <button id="downloadJsonBtn"
                    class="hidden bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow">
                    ⬇️ Download JSON
                </button>
            </div>
            <div>
                <div class="">
                    <!-- Love Icon Button -->
                    <button id="loveBtn"
                        class="absolute top-2 right-2 text-white border border-black rounded-full p-2 transition"
                        title="Save this Page Info">
                        <svg id="loveIcon" xmlns="http://www.w3.org/2000/svg"
                            class="w-5 h-5 fill-current transition duration-300 ease-in-out transform"
                            viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4c1.74 0 
            3.41 1.01 4.13 2.44h1.75C14.09 5.01 15.76 4 17.5 4 20 4 22 6 
            22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z">
                            </path>
                        </svg>
                    </button>


                </div>


            </div>
        </div>
        <div id="instagramContent" class="tab-content mt-4 hidden flex flex-row flex-wrap">
            <!-- Content for Instagram Pages -->
            <p>This is the content for Instagram Pages.</p>
        </div>
        <div id="tiktokContent" class="tab-content mt-4 hidden flex flex-row flex-wrap">
            <!-- Content for Tiktok Pages -->
            <p>This is the content for Tiktok Pages.</p>
        </div>
        <div id="youtubeContent" class="tab-content mt-4 hidden flex flex-row flex-wrap">
            <!-- Content for Youtube Pages -->
            <p>This is the content for Youtube Pages.</p>
        </div>
    </div>
    <!-- Add this inside the popup.html file -->
    <div id="spinner" class="hidden fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-50">
        <div class="spinner-border animate-spin border-4 border-blue-500 border-t-transparent rounded-full w-16 h-16">
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
